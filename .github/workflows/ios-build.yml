name: iOS manual build
on:
  workflow_dispatch:
    inputs:
      validation:
        description: Full build or rendering check only
        type: choice
        options: [full, rendering]
        default: full
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build and test on iOS Simulator
        env:
          VALIDATION: ${{ inputs.validation }}
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import sys,json; d=json.load(sys.stdin); print(next(x["udid"] for k,v in d["devices"].items() if "iOS" in k for x in v if x["name"].startswith("iPhone")))')
          TEST_ARGS=()
          if [ "$VALIDATION" = rendering ]; then TEST_ARGS=(-only-testing:TimerTests/TimerTests/testRenderEvidence); fi
          xcodebuild test -project GTAVITimer.xcodeproj -scheme GTAVITimer -destination "platform=iOS Simulator,id=$DEVICE" -parallel-testing-enabled NO -derivedDataPath build/simulator -resultBundlePath build/Tests.xcresult CODE_SIGNING_ALLOWED=NO "${TEST_ARGS[@]}"
      - name: Build unsigned device app and package IPA
        if: inputs.validation != 'rendering'
        run: bash Scripts/build-unsigned.sh
      - name: Export test screenshots
        if: always()
        run: |
          if [ -d build/Tests.xcresult ]; then
            xcrun xcresulttool export attachments --path build/Tests.xcresult --output-path build/screenshots
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-build-evidence
          path: |
            build/GTA-VI-Timer-unsigned.ipa
            build/Tests.xcresult
            build/screenshots
            GTAVITimer.xcodeproj
            App/Info.plist
            App/GTAVITimer.entitlements
            Widget/Info.plist
            Widget/TimerWidget.entitlements
          retention-days: 14
