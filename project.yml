name: GTAVITimer
options:
  bundleIdPrefix: com.kaido1070
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    DEVELOPMENT_TEAM: ''
    APP_GROUP_IDENTIFIER: group.com.kaido1070.gtavitimer
    TARGETED_DEVICE_FAMILY: '1'
    MARKETING_VERSION: '1.0'
    CURRENT_PROJECT_VERSION: '1'
targets:
  GTAVITimer:
    type: application
    platform: iOS
    sources: [App, Shared]
    resources: [Resources/Assets.xcassets]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kaido1070.gtavitimer
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: GTA VI Timer
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        AppGroupIdentifier: $(APP_GROUP_IDENTIFIER)
    entitlements:
      path: App/GTAVITimer.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP_IDENTIFIER)]
    dependencies:
      - target: TimerWidget
  TimerWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    resources:
      - path: Resources/Assets.xcassets
        excludes: [AppIcon.appiconset]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kaido1070.gtavitimer.widget
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: ''
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: GTA VI Timer
        AppGroupIdentifier: $(APP_GROUP_IDENTIFIER)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/TimerWidget.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP_IDENTIFIER)]
  TimerTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: GTAVITimer
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  GTAVITimer:
    build:
      targets:
        GTAVITimer: all
        TimerWidget: all
    test:
      targets: [TimerTests]
